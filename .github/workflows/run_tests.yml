name: ci

on:
  push:
    branches: [ "main", "release-*" ]
  pull_request:
    branches: [ "main", "release-*" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  APT_INSTALL_LINUX: 'apt -y install build-essential cmake git libboost-all-dev miniupnpc libunbound-dev libunwind8-dev pkg-config libssl-dev libzmq3-dev libsodium-dev libhidapi-dev libnorm-dev libusb-1.0-0-dev libpgm-dev libprotobuf-dev protobuf-compiler'
  APT_SET_CONF: |
        echo "Acquire::Retries \"3\";"         | sudo tee -a /etc/apt/apt.conf.d/80-custom
        echo "Acquire::http::Timeout \"120\";" | sudo tee -a /etc/apt/apt.conf.d/80-custom
        echo "Acquire::ftp::Timeout \"120\";"  | sudo tee -a /etc/apt/apt.conf.d/80-custom
  BREW_INSTALL_MAC: 'HOMEBREW_NO_AUTO_UPDATE=1 brew install boost hidapi openssl@3 zmq libpgm miniupnpc expat libunwind-headers protobuf rust unbound'
  CONFIGURE: '-B "$GITHUB_WORKSPACE/lwsf/build" -DCMAKE_BUILD_TYPE=Release -DMONERO_SOURCE_DIR="$GITHUB_WORKSPACE/monero" -DLWSF_BUILD_TESTS=ON -S "$GITHUB_WORKSPACE/lwsf"'
  # macOS has no nproc; an empty -j would run every compile at once.
  BUILD: 'cmake --build "$GITHUB_WORKSPACE/lwsf/build" -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)'
  RUN: 'ctest --test-dir "$GITHUB_WORKSPACE/lwsf/build" --output-on-failure'

jobs:
  # The sanitizer, linux and windows jobs build against Monero's release
  # branch, the Monero the wallets ship lwsf with. master is covered by the
  # unix job below.
  sanitizer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]
    steps:
      - name: Install Dependencies
        run: |
          ${{env.APT_SET_CONF}}
          sudo apt update
          sudo ${{env.APT_INSTALL_LINUX}}
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          path: ${{github.workspace}}/monero
          submodules: recursive
          ref: release-v0.18
      - name: Checkout LWSF Source
        uses: actions/checkout@v4
        with:
          path: ${{github.workspace}}/lwsf
          submodules: recursive
      - name: Configure LWSF
        run: cmake -DLWSF_SANITIZER=${{matrix.sanitizer}} ${{env.CONFIGURE}}
      - name: Build LWSF
        run: ${{env.BUILD}}
      - name: Run Tests
        run: ${{env.RUN}}
  linux:
    runs-on: ubuntu-latest
    container: ${{matrix.distro}}
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux:base-devel, debian:bookworm-slim, debian:trixie-slim]
    steps:
      - name: Install Dependencies (Debian/apt)
        if: matrix.distro == 'debian:bookworm-slim' || matrix.distro == 'debian:trixie-slim'
        run: |
          apt update
          ${{env.APT_INSTALL_LINUX}}
      - name: Install Cargo (rustup)
        if: matrix.distro == 'debian:bookworm-slim'
        run: |
          apt -y install curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install Cargo (Debian/apt)
        if: matrix.distro == 'debian:trixie-slim'
        run: apt -y install cargo
      - name: Install Dependencies (Arch/pacman)
        if: matrix.distro == 'archlinux:base-devel'
        run: |
          sudo pacman --noconfirm -Syu
          sudo pacman --noconfirm -S cmake boost boost-libs git hidapi libsodium miniupnpc openssl rustup unbound zeromq
          rustup default stable
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          path: ${{github.workspace}}/monero/
          submodules: recursive
          ref: release-v0.18
      - name: Checkout LWS Source
        uses: actions/checkout@v4
        with:
          path: ${{github.workspace}}/lwsf
      - name: Configure LWS
        run: cmake ${{env.CONFIGURE}}
      - name: Build LWS
        run: ${{env.BUILD}}    
      - name: Run Tests
        run: ${{env.RUN}}
  unix:
    runs-on: ${{matrix.os}}
    # Monero's master changes its wallet API ahead of lwsf; a failure there is
    # reported without failing the run.
    continue-on-error: ${{ matrix.branch == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        branch: [master, release-v0.18]
        os: [macos-15, macos-26, ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
        run: |
          ${{env.APT_SET_CONF}}
          sudo apt update
          sudo ${{env.APT_INSTALL_LINUX}}
          sudo apt -y install cargo
      - name: Install dependencies (MacOS)
        if: matrix.os == 'macos-15' || matrix.os == 'macos-26'
        # Homebrew's openssl is OpenSSL 4, which Monero's release branch does
        # not compile against. Monero looks up `brew --prefix openssl` only
        # when OPENSSL_ROOT_DIR is unset.
        run: |
          ${{env.BREW_INSTALL_MAC}}
          echo "OPENSSL_CMAKE_FLAG=-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          path: ${{github.workspace}}/monero/
          submodules: recursive
          ref: ${{matrix.branch}}
      - name: Checkout LWSF Source
        uses: actions/checkout@v4
        with:
          path: ${{github.workspace}}/lwsf
          submodules: recursive
      - name: Configure LWS (master)
        if: matrix.branch == 'master'
        run: cmake $OPENSSL_CMAKE_FLAG -DLWSF_MASTER_ENABLE=ON ${{env.CONFIGURE}}
      - name: Configure LWS (release)
        if: matrix.branch == 'release-v0.18'
        run: cmake $OPENSSL_CMAKE_FLAG ${{env.CONFIGURE}}
      - name: Build LWSF
        run: ${{env.BUILD}}
      - name: Run Tests
        run: ${{env.RUN}}
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          # MSYS2 no longer ships hidapi or unbound for MINGW64.
          msystem: UCRT64
          update: true
          install: >
            coreutils
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-rustup
            mingw-w64-ucrt-x86_64-unbound
            mingw-w64-ucrt-x86_64-zeromq
      - name: Install rust/cargo
        run: rustup default stable
      - name: Checkout Monero Source
        uses: actions/checkout@v4
        with:
          repository: monero-project/monero
          path: ${{github.workspace}}/monero/
          submodules: recursive
          ref: release-v0.18
      - name: Checkout LWSF Source
        uses: actions/checkout@v4
        with:
          path: ${{github.workspace}}/lwsf
          submodules: recursive
      - name: Configure LWS
        run: cmake ${{env.CONFIGURE}}
      - name: Build LWSF
        run: ${{env.BUILD}}
      - name: Run Tests
        run: ${{env.RUN}}
